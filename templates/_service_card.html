<article class="service-card"><a href="{{url_for('detail',slug=s.slug)}}" class="card-image"><img src="{{url_for('static',filename='img/'+s.image)}}" alt="{{s.name}}"></a><div class="card-body"><h3><a href="{{url_for('detail',slug=s.slug)}}">{{s.name}}</a></h3><p>{{s.short}}</p><div class="card-meta"><span>⌂ &nbsp;{{s.venue}}</span><span>◷ &nbsp;{{s.duration}}</span></div><div class="card-bottom"><span>From <strong>₹ {{'{:,}'.format(s.price)}}</strong></span><a class="circle-arrow" href="{{url_for('detail',slug=s.slug)}}" aria-label="View {{s.name}}">→</a></div></div></article>
