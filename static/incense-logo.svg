<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" role="img" aria-labelledby="title desc">
<title id="title">EntePooja animated incense logo</title>
<desc id="desc">Two incense sticks in a brass holder, glowing embers and curling smoke, beside EntePooja wordmark.</desc>
<style>
:root{color-scheme:light}.smoke{fill:none;stroke:#8f8277;stroke-width:3;stroke-linecap:round;opacity:0;stroke-dasharray:110;stroke-dashoffset:110;animation:smoke 5s ease-in-out infinite}.s2{animation-delay:1.65s}.s3{animation-delay:3.3s}.ember{animation:glow 2.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spark{animation:spark 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.spark.two{animation-delay:1.2s}.word{font-family:Georgia,'Times New Roman',serif;font-size:64px;fill:#702c35;letter-spacing:-2px}.sub{font-family:Arial,sans-serif;font-size:14px;fill:#8d6b46;letter-spacing:3.5px}@keyframes smoke{0%{stroke-dashoffset:110;opacity:0;transform:translateY(7px)}20%{opacity:.65}65%{stroke-dashoffset:0;opacity:.5}100%{stroke-dashoffset:-110;opacity:0;transform:translateY(-22px)}}@keyframes glow{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.2)}}@keyframes spark{0%{opacity:0;transform:translateY(0) scale(.6)}25%{opacity:.8}100%{opacity:0;transform:translate(8px,-28px) scale(.2)}}@media(prefers-reduced-motion:reduce){.smoke,.ember,.spark{animation:none}.smoke{opacity:.45;stroke-dashoffset:0}}
</style>
<g transform="translate(38 10)">
<!-- brass vessel -->
<path d="M24 158 Q58 168 92 158 L83 176 Q58 186 33 176Z" fill="#b78740"/>
<path d="M34 175 Q58 186 83 175" fill="none" stroke="#e4c17e" stroke-width="3"/>
<path d="M47 181 L45 189 Q58 196 71 189 L69 181" fill="#9c692f"/>
<path d="M40 190 H76" stroke="#b78740" stroke-width="5" stroke-linecap="round"/>
<!-- incense sticks -->
<path d="M56 160 L44 70" stroke="#4b3028" stroke-width="5" stroke-linecap="round"/>
<path d="M64 160 L83 84" stroke="#65442c" stroke-width="5" stroke-linecap="round"/>
<path d="M44 72 L43 65" stroke="#c36d38" stroke-width="5" stroke-linecap="round"/>
<path d="M83 86 L85 79" stroke="#c36d38" stroke-width="5" stroke-linecap="round"/>
<circle class="ember" cx="43" cy="65" r="4" fill="#ec9b4c"/>
<circle class="ember" cx="85" cy="79" r="3.5" fill="#e8a75d"/>
<!-- curling smoke trails -->
<path class="smoke" d="M43 59 C18 44 61 30 38 12 C27 3 40 -10 44 -18"/>
<path class="smoke s2" d="M85 73 C105 55 68 44 92 25 C105 12 83 -3 94 -17"/>
<path class="smoke s3" d="M56 55 C69 36 48 24 62 6 C72 -8 58 -17 62 -25"/>
<circle class="spark" cx="43" cy="62" r="2.5" fill="#d49b4e"/>
<circle class="spark two" cx="85" cy="76" r="2" fill="#d49b4e"/>
</g>
<text class="word" x="170" y="111">EntePooja</text>
<path d="M172 128 H560" stroke="#d8bf9a" stroke-width="1"/>
<text class="sub" x="174" y="154">SACRED RITUALS, SIMPLY ARRANGED</text>
</svg>
